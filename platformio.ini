[env:esp32-2432S028]
platform       = espressif32@6.9.0
board          = esp32dev
extra_scripts  = scripts/post_build_copy.py
framework      = arduino
monitor_speed  = 115200
upload_speed   = 921600

; Größere Partition, weil LVGL + Fonts etwas Platz brauchen
board_build.partitions = huge_app.csv

lib_deps =
    lvgl/lvgl@~8.3.11
    ; WICHTIG: LovyanGFX auf 1.2.19 festnageln.
    ; Ab 1.2.20 bringt LovyanGFX einen eigenen LVGL-Font-"Shim"
    ; mit (src/lvgl.h), der gegen LVGL 9 API geschrieben ist —
    ; kracht mit unserem LVGL 8.3. 1.2.19 hat den Shim nicht.
    lovyan03/LovyanGFX@=1.2.19
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1

build_flags =
    ; ─────────────────────────────────────────────────────────────
    ;  LVGL-Config direkt als Compiler-Defines (LV_CONF_SKIP).
    ;  Kein File-Lookup → keine Pfad-Probleme mit PIO-LDF.
    ; ─────────────────────────────────────────────────────────────
    -D LV_CONF_SKIP=1
    -D LV_COLOR_16_SWAP=1
    -D LV_MEM_SIZE=32768
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_28=1
    -D LV_FONT_MONTSERRAT_36=1
    -D LV_FONT_MONTSERRAT_40=1
    -D LV_FONT_MONTSERRAT_48=1
    -D LV_THEME_DEFAULT_DARK=1
    -D LV_USE_QRCODE=1

    -std=gnu++17
build_unflags =
    -std=gnu++11

; Diagnose-Sketch aus dem Build ausschließen (darf weiter im Ordner liegen).
; Zum Testen einfach das Minus vor main.cpp setzen und das Minus vor
; main_diag.cpp entfernen.
build_src_filter =
    +<*>
    -<main_diag.cpp>